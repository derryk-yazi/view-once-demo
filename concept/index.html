<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Concept</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root {
--ink: #0d2235;
--body: #475c6b;
--green: #15995b;
--font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
margin: 0; padding: 0; height: 100%;
font-family: var(--font);
background: #0d2235;
overflow: hidden;
-webkit-font-smoothing: antialiased;
}
.screen {
position: fixed; inset: 0;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 30px 26px calc(30px + env(safe-area-inset-bottom));
text-align: center;
}
.screen.on { display: flex; }

/* intro + end share this plain card look */
#intro, #desktop, #done { background: #ffffff; }
h1 {
font-size: 25px; line-height: 1.22; font-weight: 740;
letter-spacing: -0.025em; color: var(--ink);
margin: 0 0 16px; max-width: 19em;
}
p.sub {
font-size: 16.5px; line-height: 1.5; color: var(--body);
margin: 0 0 32px; max-width: 21em;
}
button.cta {
appearance: none; border: 0; cursor: pointer;
background: var(--green); color: #fff;
font-family: var(--font); font-size: 17px; font-weight: 650;
letter-spacing: -0.01em;
padding: 16px 30px; border-radius: 14px;
min-width: 210px;
}
button.cta:active { background: #0f7d4a; }

/* viewer */
#viewer { background: #05080c; padding: 0; }
#cv {
position: absolute; inset: 0;
width: 100%; height: 100%;
display: block;
touch-action: none; user-select: none;
-webkit-user-select: none; -webkit-touch-callout: none;
}
#hint {
position: absolute; left: 0; right: 0; bottom: 0;
padding: 22px 26px calc(26px + env(safe-area-inset-bottom));
color: #fff; font-size: 16px; font-weight: 600;
letter-spacing: -0.01em;
text-shadow: 0 1px 10px rgba(0,0,0,0.55);
pointer-events: none;
background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
transition: opacity 0.18s;
}
#viewer.held #hint { opacity: 0; }
#bar {
position: absolute; left: 0; top: 0; height: 3px;
width: 100%; background: var(--green);
transform-origin: 0 50%;
pointer-events: none;
}
.lock {
position: absolute; inset: 0;
display: flex; align-items: center; justify-content: center;
flex-direction: column; gap: 10px;
background: #11161c;
color: #8795a3; font-size: 17px; font-weight: 650;
letter-spacing: -0.01em;
pointer-events: none;
transition: opacity 0.12s;
}
#viewer.held .lock { opacity: 0; }
.lock small { font-size: 14px; font-weight: 500; color: #5d6b78; }
</style>
</head>
<body>

<div class="screen on" id="gate"></div>

<div class="screen" id="desktop">
<h1>Open this on your phone</h1>
<p class="sub">This concept can only be viewed on a mobile device. Open the message on your phone and tap the button again.</p>
</div>

<div class="screen" id="intro">
<h1 id="introTitle"></h1>
<p class="sub" id="introSub"></p>
<button class="cta" id="start">View the concept</button>
</div>

<div class="screen" id="viewer">
<canvas id="cv"></canvas>
<div class="lock" id="lock">Press and hold to reveal<small>One view only</small></div>
<div id="bar"></div>
<div id="hint">Keep holding &mdash; it hides the moment you let go</div>
</div>

<div class="screen" id="done">
<h1>That concept is gone</h1>
<p class="sub">Thanks &mdash; your viewing time is used up.</p>
<button class="cta" id="close">Close</button>
</div>

<script>
(function () {
'use strict';

/* ---- the copy, in one place ---- */
var INTRO_TITLE = 'You\u2019re about to view a concept image that will disappear.';
var INTRO_SUB   = 'Press and hold the screen to keep it visible. It hides the moment you let go, and you have 3 seconds of viewing in total.';

var BUDGET_MS = 3000;
var PARTICIPANT = '+27 84 \u2022\u2022\u2022 2082';

var screens = ['gate', 'desktop', 'intro', 'viewer', 'done'];
function show(id) {
screens.forEach(function (s) {
document.getElementById(s).classList.toggle('on', s === id);
});
}

/* ---- mobile gate: no image at all on desktop ---- */
var isMobile = (function () {
if (/Android|iPhone|iPod|Windows Phone/i.test(navigator.userAgent)) return true;
if (/iPad/i.test(navigator.userAgent)) return true;
if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
return !!(coarse && navigator.maxTouchPoints > 0);
})();

document.getElementById('introTitle').textContent = INTRO_TITLE;
document.getElementById('introSub').textContent = INTRO_SUB;

if (!isMobile) { show('desktop'); return; }
show('intro');

/* ---- canvases ---- */
var AW = 1080, AH = 1350;
var art = document.createElement('canvas');
var actx = art.getContext('2d');
function sizeArt() {
var vw = window.innerWidth, vh = window.innerHeight;
AW = 1080;
AH = Math.round(AW * (vh / vw));
AH = Math.max(1150, Math.min(AH, 2600));
art.width = AW; art.height = AH;
W = AW; H = AH;
}

var cv = document.getElementById('cv');
var sctx = cv.getContext('2d');
var viewer = document.getElementById('viewer');
var bar = document.getElementById('bar');

var ctx = actx, W = AW, H = AH, userImg = null, watermark = true;
sizeArt();

    function fontStack() {
        return '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    }

    function roundRect(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    // Deterministic, so the condensation does not shimmer between frames.
    function seeded(seed) {
        var s = seed;
        return function () {
            s = (s * 1664525 + 1013904223) % 4294967296;
            return s / 4294967296;
        };
    }

    function drawStimulus() {
        if (userImg) {
            var sc = Math.max(W / userImg.width, H / userImg.height);
            var dw = userImg.width * sc, dh = userImg.height * sc;
            ctx.drawImage(userImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
            return;
        }

        // ---- studio backdrop ----
        var bg = ctx.createLinearGradient(0, 0, W * 0.4, H);
        bg.addColorStop(0, '#1d6b5c');
        bg.addColorStop(0.45, '#15594d');
        bg.addColorStop(1, '#0c3b34');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // pool of light behind the product
        var glow = ctx.createRadialGradient(W * 0.5, H * 0.42, W * 0.05, W * 0.5, H * 0.46, W * 0.78);
        glow.addColorStop(0, 'rgba(126,214,190,0.30)');
        glow.addColorStop(0.55, 'rgba(60,150,130,0.10)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);

        // ---- can geometry ----
        var cw = W * 0.40;
        var ch = cw * 2.42;
        var cx = W * 0.5;
        var cy = H * 0.5 - ch * 0.04;
        var left = cx - cw / 2, top = cy - ch / 2;
        var rx = cw / 2, ry = cw * 0.165;

        // contact shadow
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, top + ch + ry * 0.25, cw * 0.78, ry * 0.95, 0, 0, Math.PI * 2);
        var sh = ctx.createRadialGradient(cx, top + ch + ry * 0.25, 0, cx, top + ch + ry * 0.25, cw * 0.78);
        sh.addColorStop(0, 'rgba(3,26,22,0.62)');
        sh.addColorStop(1, 'rgba(3,26,22,0)');
        ctx.fillStyle = sh;
        ctx.fill();
        ctx.restore();

        // ---- body ----
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(left, top);
        ctx.lineTo(left, top + ch - ry);
        ctx.ellipse(cx, top + ch - ry, rx, ry, 0, Math.PI, 0, true);
        ctx.lineTo(left + cw, top);
        ctx.closePath();
        ctx.clip();

        var body = ctx.createLinearGradient(left, 0, left + cw, 0);
        body.addColorStop(0.00, '#5c0d1c');
        body.addColorStop(0.10, '#8e1430');
        body.addColorStop(0.26, '#d8355a');
        body.addColorStop(0.33, '#f07d95');
        body.addColorStop(0.40, '#c92247');
        body.addColorStop(0.72, '#a3123a');
        body.addColorStop(0.89, '#6d0f24');
        body.addColorStop(1.00, '#48091a');
        ctx.fillStyle = body;
        ctx.fillRect(left, top, cw, ch);

        // vertical sheen falloff top and bottom
        var vv = ctx.createLinearGradient(0, top, 0, top + ch);
        vv.addColorStop(0, 'rgba(255,255,255,0.16)');
        vv.addColorStop(0.12, 'rgba(255,255,255,0)');
        vv.addColorStop(0.86, 'rgba(0,0,0,0.12)');
        vv.addColorStop(1, 'rgba(0,0,0,0.34)');
        ctx.fillStyle = vv;
        ctx.fillRect(left, top, cw, ch);

        // ---- branding ----
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = 'rgba(255,255,255,0.97)';
        ctx.font = '800 ' + (cw * 0.235) + 'px ' + fontStack();
        ctx.fillText('KHANYA', cx, top + ch * 0.335);

        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = Math.max(1, cw * 0.006);
        ctx.beginPath();
        ctx.moveTo(cx - cw * 0.26, top + ch * 0.395);
        ctx.lineTo(cx + cw * 0.26, top + ch * 0.395);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.font = '650 ' + (cw * 0.072) + 'px ' + fontStack();
        ctx.fillText('ICED ROOIBOS', cx, top + ch * 0.437);
        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.font = '500 ' + (cw * 0.060) + 'px ' + fontStack();
        ctx.fillText('LEMON', cx, top + ch * 0.477);

        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '600 ' + (cw * 0.055) + 'px ' + fontStack();
        ctx.fillText('NO ADDED SUGAR', cx, top + ch * 0.70);
        ctx.fillStyle = 'rgba(255,255,255,0.80)';
        ctx.font = '700 ' + (cw * 0.062) + 'px ' + fontStack();
        ctx.fillText('330 ml', cx, top + ch * 0.765);

        // ---- condensation, clipped to the body ----
        var rnd = seeded(20260107);
        for (var i = 0; i < 150; i++) {
            var dx = left + rnd() * cw;
            var dy = top + rnd() * ch;
            var dr = cw * (0.004 + rnd() * 0.016);
            var edge = 1 - Math.abs((dx - cx) / rx);
            if (edge < 0.08) continue;

            ctx.beginPath();
            ctx.arc(dx, dy, dr, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + rnd() * 0.10) + ')';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(dx - dr * 0.32, dy - dr * 0.34, dr * 0.34, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,' + (0.30 + rnd() * 0.40) + ')';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(dx + dr * 0.26, dy + dr * 0.30, dr * 0.42, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(60,0,14,0.16)';
            ctx.fill();
        }

        // a few runs
        for (var j = 0; j < 7; j++) {
            var rxp = left + cw * (0.14 + rnd() * 0.72);
            var ryp = top + ch * (0.12 + rnd() * 0.5);
            var rl = ch * (0.05 + rnd() * 0.14);
            var rw = cw * 0.009;
            var g = ctx.createLinearGradient(0, ryp, 0, ryp + rl);
            g.addColorStop(0, 'rgba(255,255,255,0.34)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(rxp, ryp, rw, rl);
        }
        ctx.restore();

        // ---- lid ----
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, top, rx, ry, 0, 0, Math.PI * 2);
        var lid = ctx.createLinearGradient(left, 0, left + cw, 0);
        lid.addColorStop(0, '#6f757a');
        lid.addColorStop(0.22, '#d6dade');
        lid.addColorStop(0.42, '#f4f6f7');
        lid.addColorStop(0.62, '#aeb4b9');
        lid.addColorStop(1, '#5d6368');
        ctx.fillStyle = lid;
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cx, top + ry * 0.16, rx * 0.80, ry * 0.72, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(55,62,66,0.55)';
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cx, top + ry * 0.20, rx * 0.70, ry * 0.60, 0, 0, Math.PI * 2);
        var inner = ctx.createLinearGradient(left, 0, left + cw, 0);
        inner.addColorStop(0, '#8d9398');
        inner.addColorStop(0.45, '#cfd4d8');
        inner.addColorStop(1, '#71777c');
        ctx.fillStyle = inner;
        ctx.fill();

        // tab
        ctx.beginPath();
        ctx.ellipse(cx + rx * 0.10, top + ry * 0.18, rx * 0.26, ry * 0.26, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(90,97,102,0.85)';
        ctx.lineWidth = Math.max(1, cw * 0.012);
        ctx.stroke();
        ctx.restore();

        // neck shading just under the lid
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, cw, ry * 1.5);
        ctx.clip();
        var neck = ctx.createLinearGradient(0, top, 0, top + ry * 1.5);
        neck.addColorStop(0, 'rgba(0,0,0,0.30)');
        neck.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = neck;
        ctx.fillRect(left, top, cw, ry * 1.5);
        ctx.restore();

        // ---- vignette ----
        var vg = ctx.createRadialGradient(W * 0.5, H * 0.46, W * 0.30, W * 0.5, H * 0.5, W * 0.95);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.42)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
    }


    function drawWatermark(ts) {
        if (!watermark) return;
        var d = new Date();
        var label = PARTICIPANT + '  ·  ' +
            String(d.getHours()).padStart(2, '0') + ':' +
            String(d.getMinutes()).padStart(2, '0') + ':' +
            String(d.getSeconds()).padStart(2, '0');

        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = 'rgba(40,46,70,0.15)';
        ctx.font = '600 ' + (W * 0.03) + 'px ' + fontStack();
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'start';

        var drift = (ts / 60) % 180;
        ctx.translate(W / 2, H / 2);
        ctx.rotate(-24 * Math.PI / 180);
        ctx.translate(-W, -H);

        var stepY = H * 0.2;
        var stepX = ctx.measureText(label).width + W * 0.22;
        for (var y = 0; y < H * 2.2; y += stepY) {
            var offset = ((y / stepY) % 2) * (stepX / 2) - drift;
            for (var x = offset; x < W * 2.4; x += stepX) {
                ctx.fillText(label, x, y);
            }
        }
        ctx.restore();
    }

    /* ---------- hidden states ---------- */


function sizeScreen() {
var r = Math.min(window.devicePixelRatio || 1, 2.5);
cv.width = Math.round(window.innerWidth * r);
cv.height = Math.round(window.innerHeight * r);
}
window.addEventListener('resize', function () { sizeArt(); sizeScreen(); });
sizeScreen();

function blit() {
var s = Math.max(cv.width / AW, cv.height / AH);
var dw = AW * s, dh = AH * s;
sctx.clearRect(0, 0, cv.width, cv.height);
sctx.drawImage(art, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
}

/* ---- state (in memory only: reopening the link gives a fresh view) ---- */
var held = false, remaining = BUDGET_MS, last = 0, spent = false;

function frame(ts) {
if (spent) return;
if (!last) last = ts;
var dt = ts - last; last = ts;
if (held) {
remaining = Math.max(0, remaining - dt);
drawStimulus();
drawWatermark(ts);
blit();
if (remaining === 0) { burn(); return; }
}
bar.style.transform = 'scaleX(' + (remaining / BUDGET_MS) + ')';
requestAnimationFrame(frame);
}

function burn() {
spent = true;
held = false;
viewer.classList.remove('held');
sctx.clearRect(0, 0, cv.width, cv.height);
show('done');
}

function grab(e) {
if (spent) return;
e.preventDefault();
held = true; last = 0;
viewer.classList.add('held');
}
function release() {
if (spent || !held) return;
held = false;
viewer.classList.remove('held');
sctx.clearRect(0, 0, cv.width, cv.height);
}

cv.addEventListener('pointerdown', grab);
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
cv.addEventListener('dragstart', function (e) { e.preventDefault(); });
document.addEventListener('visibilitychange', function () { if (document.hidden) release(); });
window.addEventListener('blur', release);
window.addEventListener('pagehide', release);

document.getElementById('start').addEventListener('click', function () {
show('viewer');
sizeScreen();
requestAnimationFrame(frame);
});

document.getElementById('close').addEventListener('click', function () {
// There is no web API that closes WhatsApp's in-app browser. Two best-effort
// attempts, and they MUST run synchronously inside the click: iOS only honours
// a custom-scheme handoff while a user gesture is still active, which is why
// doing this from a setTimeout did nothing at all.
try { window.open('', '_self'); window.close(); } catch (e) {}
// Foregrounding WhatsApp itself is the one that usually sticks: the webview
// goes to the background exactly as if Done had been tapped.
location.href = 'whatsapp://';
});

})();
</script>
</body>
</html>
